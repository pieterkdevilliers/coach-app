services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
      - recordings_data:/data/recordings
    ports:
      - "8013:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://coach:coach@postgres:5432/coach
      FILE_STORAGE_PATH: /data/recordings
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3013:3000"
    environment:
      NUXT_PUBLIC_API_BASE: https://ee-coach-app-api.expertecho.ai
    depends_on:
      - backend

volumes:
  postgres_data:
  recordings_data:
